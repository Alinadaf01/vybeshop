# Temporary HTTP-only Nginx config, used ONLY by deploy/setup.sh stage 6 to
# solve the Certbot chicken-and-egg problem: the real nginx/nginx.conf
# references SSL certificate files that don't exist until Certbot has
# already run — but Certbot's HTTP-01 challenge needs Nginx serving plain
# HTTP on port 80 first. setup.sh swaps this file in as nginx.conf, brings
# Nginx up, requests the certificate, then swaps the real nginx.conf back.
#
# Not meant to be used any other way — if you're reading this outside that
# swap, you want nginx/nginx.conf instead.

server {
    listen 80;
    server_name api.vybeshop.ir admin.vybeshop.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "vybeshop backend — SSL bootstrap in progress\n";
        add_header Content-Type text/plain;
    }
}
