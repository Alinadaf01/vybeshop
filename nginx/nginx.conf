# Production Nginx config (§8 deploy prep) — prepared, not executed.
#
# Two domains: vybeshop.ir (storefront) and admin.vybeshop.ir (admin panel).
# Change both to the real domain before first use — see DEPLOY.md, which
# also explains the two-phase bootstrap this file assumes (HTTP-only first
# to obtain certs via certbot, then this full HTTP->HTTPS config).
#
# SSL cert paths below assume certbot's default layout under
# /etc/letsencrypt/live/<domain>/ — matches the ./certbot/conf volume mount
# in docker-compose.prod.yml.

upstream django_backend {
    server web:8000;
}

# ACME HTTP-01 challenge — must stay reachable over plain HTTP even after
# HTTPS is set up, for certificate renewal.
server {
    listen 80;
    server_name vybeshop.ir www.vybeshop.ir admin.vybeshop.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name vybeshop.ir www.vybeshop.ir;

    ssl_certificate     /etc/letsencrypt/live/vybeshop.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vybeshop.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;  # product/blog image uploads go through /api/

    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Read by SECURE_PROXY_SSL_HEADER in config/settings.py — without
        # this, Django can't tell the original request was HTTPS and its
        # own SECURE_SSL_REDIRECT would redirect-loop.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/media/;
        expires 30d;
    }

    # Must come before the SPA catch-all below — without this, a missing
    # static image (e.g. an unconverted src/data/*.ts reference) falls
    # through try_files to /index.html, returning 200/text/html instead of a
    # real 404. The <Image> component's <picture>/<source> webp srcset
    # doesn't reliably surface that as a load failure, so the ImagePlaceholder
    # fallback never kicks in and the image silently stays broken instead of
    # showing the intended striped placeholder.
    location /images/ {
        root /var/www/storefront;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /var/www/storefront;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.vybeshop.ir;

    ssl_certificate     /etc/letsencrypt/live/vybeshop.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vybeshop.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The admin panel's own JS calls /api/admin/... directly against this
    # same origin (see admin/.env.example's VITE_ADMIN_API_BASE_URL) — proxy
    # it here too rather than requiring a separate CORS-enabled cross-origin
    # setup between admin.vybeshop.ir and vybeshop.ir.
    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /var/www/media/;
        expires 30d;
    }

    location / {
        root /var/www/admin;
        try_files $uri $uri/ /index.html;
    }
}
