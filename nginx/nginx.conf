# Production Nginx config. Vercel's deployment was disabled (billing issue,
# HTTP 402/DEPLOYMENT_DISABLED, confirmed not a code/DNS problem) so the
# storefront moved back onto this same server alongside api.vybeshop.ir and
# admin.vybeshop.ir -- reviving the pre-"Option B" vybeshop.ir server block
# (see git history on this file before commit 06f1d88) rather than writing
# one from scratch, since that version was already built, reviewed, and had
# a real bug fixed in it (the /images/ 404 handling below).
#
# vybeshop.ir/www.vybeshop.ir get their own certbot certificate, separate
# from api./admin.'s existing one -- lower risk than reissuing a cert that's
# already working for two live domains just to add a third name to it.
#
# The admin panel talks to its own origin (admin.vybeshop.ir/api/...),
# proxied same-origin below. The storefront now also lives on this box but
# still talks to api.vybeshop.ir cross-origin (CORS_ALLOWED_ORIGINS in
# .env.production already allows this) rather than same-origin, since that
# would mean duplicating the whole API surface under vybeshop.ir/api/ too --
# not worth it for what was meant to be a same-box-as-Vercel-ish swap.

upstream django_backend {
    server web:8000;
}

# ACME HTTP-01 challenge — must stay reachable over plain HTTP even after
# HTTPS is set up, for certificate renewal.
server {
    listen 80;
    server_name api.vybeshop.ir admin.vybeshop.ir vybeshop.ir www.vybeshop.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# api.vybeshop.ir — Django only. The Vercel-hosted storefront and the admin
# panel both call this cross-origin/same-origin respectively for JSON; media
# and Django's own /static/ (admin UI, DRF browsable API) live here too,
# since every request that can produce a media/static URL is proxied through
# this host (see backend/config/media.py's absolute_media_url, which builds
# the URL from whichever host actually received the request).
server {
    listen 443 ssl;
    http2 on;
    server_name api.vybeshop.ir;

    ssl_certificate     /etc/letsencrypt/live/api.vybeshop.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vybeshop.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;  # product/blog image uploads go through /api/

    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Read by SECURE_PROXY_SSL_HEADER in config/settings.py — without
        # this, Django can't tell the original request was HTTPS and its
        # own SECURE_SSL_REDIRECT would redirect-loop.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's own built-in /admin/ (superuser-only, separate from the VYBE
    # admin panel SPA on admin.vybeshop.ir) — same proxy, just a different
    # Django URL prefix.
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/media/;
        expires 30d;
    }

    location / {
        return 404;
    }
}

# vybeshop.ir / www.vybeshop.ir — the storefront SPA (static build), served
# same as the admin panel below but cross-origin against api.vybeshop.ir
# rather than same-origin-proxied (see the file-level comment above).
server {
    listen 443 ssl;
    http2 on;
    server_name vybeshop.ir www.vybeshop.ir;

    ssl_certificate     /etc/letsencrypt/live/vybeshop.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vybeshop.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Must come before the SPA catch-all below — without this, a missing
    # static image falls through try_files to /index.html, returning
    # 200/text/html instead of a real 404. The <Image> component's
    # <picture>/<source> webp srcset doesn't reliably surface that as a load
    # failure, so the ImagePlaceholder fallback never kicks in and the image
    # silently stays broken instead of showing the intended placeholder.
    location /images/ {
        root /var/www/storefront;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Same reasoning as /images/ above, for Vite's own content-hashed JS/CSS
    # bundles — a stale cached HTML referencing an asset from a previous
    # deploy should 404, not silently serve index.html back as that asset.
    location /assets/ {
        root /var/www/storefront;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vite's prerender output puts each route's content at <route>/index.html
    # (e.g. /faq/index.html for the /faq route). `try_files $uri $uri/
    # /index.html` (the pattern admin.vybeshop.ir below uses fine, since it
    # has no such per-route directories to collide with) resolves $uri/ via
    # nginx's directory-match rule, which 301-redirects to add a trailing
    # slash before serving the index -- confirmed live: /faq came back as a
    # 301 to /faq/ instead of serving directly, unlike Vercel's prior
    # behavior (vercel.json's trailingSlash:false). Checking $uri/index.html
    # as an explicit file path instead serves it in place, no redirect.
    location / {
        root /var/www/storefront;
        try_files $uri $uri/index.html /index.html;
    }
}

# admin.vybeshop.ir — the VYBE admin panel SPA (static build) + a same-origin
# API proxy, so the admin frontend never needs cross-origin/CORS handling.
server {
    listen 443 ssl;
    http2 on;
    server_name admin.vybeshop.ir;

    ssl_certificate     /etc/letsencrypt/live/api.vybeshop.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vybeshop.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /var/www/media/;
        expires 30d;
    }

    # Missing static assets under the admin build must 404, not fall through
    # to /index.html — same reasoning as the storefront's own /images/ fix
    # (Image.tsx's <picture>/<source> webp srcset doesn't reliably treat a
    # soft 200/text/html "not found" as a load failure).
    location /assets/ {
        root /var/www/admin;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /var/www/admin;
        try_files $uri $uri/ /index.html;
    }
}
