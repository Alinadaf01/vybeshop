# Production Nginx config — Option B architecture (DEPLOY-TASK.md): the
# storefront stays on Vercel, untouched. Only api.vybeshop.ir (Django) and
# admin.vybeshop.ir (the VYBE admin panel SPA) live on this server. There is
# deliberately NO vybeshop.ir/www.vybeshop.ir server block here — DNS for
# those never points at this box, so one would just be dead config.
#
# The storefront (on Vercel) talks to api.vybeshop.ir cross-origin — that's
# what CORS_ALLOWED_ORIGINS in .env.production is for. The admin panel talks
# to its own origin (admin.vybeshop.ir/api/...), proxied same-origin below,
# same as before.
#
# SSL cert paths assume a single certbot certificate covering BOTH hostnames
# (`certbot certonly -d api.vybeshop.ir -d admin.vybeshop.ir`), named after
# the first -d argument — see deploy/setup.sh stage 6.

upstream django_backend {
    server web:8000;
}

# ACME HTTP-01 challenge — must stay reachable over plain HTTP even after
# HTTPS is set up, for certificate renewal.
server {
    listen 80;
    server_name api.vybeshop.ir admin.vybeshop.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# api.vybeshop.ir — Django only. The Vercel-hosted storefront and the admin
# panel both call this cross-origin/same-origin respectively for JSON; media
# and Django's own /static/ (admin UI, DRF browsable API) live here too,
# since every request that can produce a media/static URL is proxied through
# this host (see backend/config/media.py's absolute_media_url, which builds
# the URL from whichever host actually received the request).
server {
    listen 443 ssl;
    http2 on;
    server_name api.vybeshop.ir;

    ssl_certificate     /etc/letsencrypt/live/api.vybeshop.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vybeshop.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;  # product/blog image uploads go through /api/

    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Read by SECURE_PROXY_SSL_HEADER in config/settings.py — without
        # this, Django can't tell the original request was HTTPS and its
        # own SECURE_SSL_REDIRECT would redirect-loop.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's own built-in /admin/ (superuser-only, separate from the VYBE
    # admin panel SPA on admin.vybeshop.ir) — same proxy, just a different
    # Django URL prefix.
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/media/;
        expires 30d;
    }

    location / {
        return 404;
    }
}

# admin.vybeshop.ir — the VYBE admin panel SPA (static build) + a same-origin
# API proxy, so the admin frontend never needs cross-origin/CORS handling.
server {
    listen 443 ssl;
    http2 on;
    server_name admin.vybeshop.ir;

    ssl_certificate     /etc/letsencrypt/live/api.vybeshop.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vybeshop.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /var/www/media/;
        expires 30d;
    }

    # Missing static assets under the admin build must 404, not fall through
    # to /index.html — same reasoning as the storefront's own /images/ fix
    # (Image.tsx's <picture>/<source> webp srcset doesn't reliably treat a
    # soft 200/text/html "not found" as a load failure).
    location /assets/ {
        root /var/www/admin;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /var/www/admin;
        try_files $uri $uri/ /index.html;
    }
}
