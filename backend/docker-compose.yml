services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vybeshop
      POSTGRES_USER: vybeshop
      POSTGRES_PASSWORD: vybeshop
    ports:
      # host 5433 -> container 5432: a native Postgres install already owns
      # host port 5432 on this machine, so the container uses an alternate port.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vybeshop"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
