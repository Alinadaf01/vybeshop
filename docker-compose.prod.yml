# Production Compose — Option B architecture (DEPLOY-TASK.md): the
# storefront stays on Vercel and is never built or served from this host.
# Only the admin panel's static build is served here (bind-mounted below,
# alongside Django itself).
#
# web/celery-worker/celery-beat PULL a prebuilt image (BACKEND_IMAGE_TAG)
# instead of building locally — this VPS can't build backend/Dockerfile
# itself (Chromium geoblocked from Iranian IPs at cdn.playwright.dev; see
# deploy/STAGE4-FIX-TASK.md). .github/workflows/build-backend-image.yml
# builds and pushes it to Docker Hub on every push to backend/** (GHCR was
# tried first but proved unreachable from this server — consistent TLS
# handshake timeouts — while Docker Hub works reliably).
#
# Always invoke with `--env-file .env.production` (deploy/setup.sh and
# DEPLOY.md's commands all do). `env_file:` below only injects vars into the
# container's own runtime — it does NOT feed the `${POSTGRES_PASSWORD}`-style
# substitution used directly in this YAML file, which Compose only reads
# from the shell environment or a file passed via --env-file (confirmed with
# `docker compose config` — omitting the flag fails with "required variable
# POSTGRES_PASSWORD is missing a value" even though .env.production exists).
#
# pgdata and media are NAMED volumes (not Compose's default anonymous
# project-scoped ones) deliberately — DEPLOY-TASK.md §3.5: an anonymous
# volume gets deleted by an errant `docker compose down -v`, along with
# every order and uploaded image the owner has ever entered. Naming them
# doesn't prevent `-v` from deleting them, but it does make the volume
# visible and identifiable in `docker volume ls` instead of a random hash,
# which is the difference between "wait, that's the real database" and
# silently wiping it. NEVER run `docker compose down -v` on this file in
# production — see deploy/RUNBOOK.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vybeshop}
      POSTGRES_USER: ${POSTGRES_USER:-vybeshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vybeshop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ${DOCKERHUB_USER}/vybeshop-backend:${BACKEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - static:/app/staticfiles
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Overrides the Dockerfile's own CMD — migrate/collectstatic need the
    # real database up first, which only Compose (not the image build) can
    # guarantee via depends_on/healthcheck.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/settings/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery-worker:
    image: ${DOCKERHUB_USER}/vybeshop-backend:${BACKEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker --loglevel=info --concurrency=2

  celery-beat:
    image: ${DOCKERHUB_USER}/vybeshop-backend:${BACKEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat --loglevel=info

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./admin/dist:/var/www/admin:ro
      - static:/var/www/static:ro
      - media:/var/www/media:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web

volumes:
  pgdata:
    name: vybe_pgdata
  redisdata:
    name: vybe_redisdata
  static:
    name: vybe_static
  media:
    name: vybe_media
