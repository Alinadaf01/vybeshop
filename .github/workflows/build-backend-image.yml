name: Build Backend Image

# Builds backend/Dockerfile and pushes to Docker Hub. This exists because the
# Iranian VPS running production can't build this image itself:
# `playwright install --with-deps chromium` inside it downloads from
# cdn.playwright.dev, which geoblocks Iranian IPs with a 403 (Azure Front
# Door, confirmed deliberate — see deploy/STAGE4-FIX-TASK.md). GitHub's own
# runners aren't geoblocked, so the build happens here instead; the server
# only ever pulls the finished image (deploy/setup.sh stage 4).
#
# Pushed to Docker Hub, not GHCR: GHCR (behind Fastly) turned out to be
# unreachable from the server with consistent TLS handshake timeouts — 5/5
# retries failed — while `docker pull` from Docker Hub on the same server
# worked immediately. Confirmed the server's own network/Docker setup is
# fine; the problem was specifically the path to ghcr.io.
#
# One image serves all three backend services (web, celery-worker,
# celery-beat) — they're the same Dockerfile with different `command:`
# overrides in docker-compose.prod.yml, so building it three times would
# just triple the ~2GB Chromium payload for no reason.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/vybeshop-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The image contains the full project source, not just a build
      # artifact — it must never be public. Docker Hub Access Tokens are
      # scoped to the Registry API (login/push/pull) only; the Hub's web API
      # that creates/configures repositories (hub.docker.com/v2/repositories/)
      # rejects PAT-authenticated requests with 403 "insufficient scope" no
      # matter what permission level the token has — confirmed by testing.
      # So this can't auto-create the repo; it only verifies a private repo
      # already exists, and fails loudly (instead of silently letting `docker
      # push` auto-create it, which for a fresh repo may default to public)
      # if it's missing or public.
      - name: Verify Docker Hub repo exists and is private
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -e
          TOKEN=$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{username:$u,password:$p}' \
            | curl -sf -H "Content-Type: application/json" -X POST -d @- https://hub.docker.com/v2/users/login/ \
            | jq -r '.token')
          HTTP_CODE=$(curl -s -o /tmp/repo-info.json -w "%{http_code}" \
            -H "Authorization: JWT $TOKEN" \
            "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/vybeshop-backend/")
          if [ "$HTTP_CODE" = "404" ]; then
            echo "::error::Docker Hub repo '$DOCKERHUB_USERNAME/vybeshop-backend' doesn't exist yet."
            echo "::error::Create it once manually (Docker Hub cannot be told to do this via an access token): https://hub.docker.com/repository/create -> name 'vybeshop-backend' -> Visibility: Private. Then re-run this workflow."
            exit 1
          fi
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Docker Hub repo lookup failed (HTTP $HTTP_CODE):"
            cat /tmp/repo-info.json
            exit 1
          fi
          IS_PRIVATE=$(jq -r '.is_private' /tmp/repo-info.json)
          if [ "$IS_PRIVATE" != "true" ]; then
            echo "::error::Docker Hub repo '$DOCKERHUB_USERNAME/vybeshop-backend' is PUBLIC. It contains the full project source and must be private. Fix its visibility in Docker Hub repo settings, then re-run."
            exit 1
          fi
          echo "Repo exists and is private — proceeding."

      - name: Compute short SHA tag
        id: vars
        run: echo "sha_tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # Two tags on every build: `latest` for convenience, and the immutable
      # sha-<7-char> one the server actually pins to in .env.production
      # (BACKEND_IMAGE_TAG) — rollback is then "change one variable and
      # `dc up -d`", not "hope `latest` still points at something that works".
      - uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
