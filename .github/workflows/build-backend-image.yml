name: Build Backend Image

# Builds backend/Dockerfile and pushes to Docker Hub. This exists because the
# Iranian VPS running production can't build this image itself:
# `playwright install --with-deps chromium` inside it downloads from
# cdn.playwright.dev, which geoblocks Iranian IPs with a 403 (Azure Front
# Door, confirmed deliberate — see deploy/STAGE4-FIX-TASK.md). GitHub's own
# runners aren't geoblocked, so the build happens here instead; the server
# only ever pulls the finished image (deploy/setup.sh stage 4).
#
# Pushed to Docker Hub, not GHCR: GHCR (behind Fastly) turned out to be
# unreachable from the server with consistent TLS handshake timeouts — 5/5
# retries failed — while `docker pull` from Docker Hub on the same server
# worked immediately. Confirmed the server's own network/Docker setup is
# fine; the problem was specifically the path to ghcr.io.
#
# One image serves all three backend services (web, celery-worker,
# celery-beat) — they're the same Dockerfile with different `command:`
# overrides in docker-compose.prod.yml, so building it three times would
# just triple the ~2GB Chromium payload for no reason.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/vybeshop-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The image contains the full project source, not just a build
      # artifact — it must never be public. `docker push` auto-creates a
      # missing Docker Hub repo, but a free account's default visibility for
      # auto-created repos isn't guaranteed private, so this creates it
      # explicitly (as private) before the first push ever happens. A no-op
      # on every push after the first.
      - name: Ensure Docker Hub repo exists and is private
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -e
          TOKEN=$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{username:$u,password:$p}' \
            | curl -sf -H "Content-Type: application/json" -X POST -d @- https://hub.docker.com/v2/users/login/ \
            | jq -r '.token')
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: JWT $TOKEN" \
            "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/vybeshop-backend/")
          if [ "$STATUS" = "404" ]; then
            echo "Repo doesn't exist yet — creating as private..."
            BODY=$(jq -n --arg ns "$DOCKERHUB_USERNAME" '{namespace:$ns,name:"vybeshop-backend",is_private:true}')
            HTTP_CODE=$(curl -s -o /tmp/create-repo-response.json -w "%{http_code}" -X POST \
              -H "Authorization: JWT $TOKEN" -H "Content-Type: application/json" -d "$BODY" \
              https://hub.docker.com/v2/repositories/)
            echo "Create-repo response (HTTP $HTTP_CODE):"
            cat /tmp/create-repo-response.json
            echo
            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "::error::Failed to create Docker Hub repo as private (HTTP $HTTP_CODE) — see response body above."
              exit 1
            fi
            echo "Created as private."
          else
            echo "Repo already exists (HTTP $STATUS) — leaving its visibility as-is."
          fi

      - name: Compute short SHA tag
        id: vars
        run: echo "sha_tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # Two tags on every build: `latest` for convenience, and the immutable
      # sha-<7-char> one the server actually pins to in .env.production
      # (BACKEND_IMAGE_TAG) — rollback is then "change one variable and
      # `dc up -d`", not "hope `latest` still points at something that works".
      - uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
