name: CI

# Runs on every push — a green e2e/test suite is not proof the site ships.
# `npm run build` broke silently at B3 and stayed broken through B5 because
# nothing ever ran it outside a developer's own machine; this workflow is
# that missing gate.
on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend — typecheck, lint, build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # The step that would have caught every one of the B3–B5 broken
      # deploys: vite build -> SSR build -> sitemap -> prerender, the exact
      # pipeline vybeshop.ir's deploy runs.
      - name: Build (client + SSR + sitemap + prerender)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  backend:
    name: Backend — Django tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vybeshop
          POSTGRES_USER: vybeshop
          POSTGRES_PASSWORD: vybeshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vybeshop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://vybeshop:vybeshop@localhost:5432/vybeshop
      SECRET_KEY: ci-only-not-a-real-secret
      # A valid Fernet key is required for encrypted_model_fields to work at
      # all (ApiCredential.credentials) — this is a throwaway CI key, never
      # used outside this workflow's ephemeral test database.
      FIELD_ENCRYPTION_KEY: mSJSz05YXXLvijNFd_qonpuHnb5TMPQROxCA0-Bxr_A=
      CELERY_TASK_ALWAYS_EAGER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - run: python manage.py migrate

      - run: python manage.py test
